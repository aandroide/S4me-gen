name: Genera canale S4Me (sul mio PC Windows)

# Gira sul runner installato sul tuo computer, quindi con il tuo indirizzo italiano.
# Serve per i siti che funzionano solo dall'Italia (per esempio la riproduzione di JustWatch TV Free).

on:
  workflow_dispatch:
    inputs:
      sito:
        description: "Indirizzo del sito, per esempio https://www.justwatch.com/it"
        required: true
      tipo:
        description: "Tipo di contenuti"
        required: false
        default: auto
        type: choice
        options: [auto, movie, tvshow, anime]
      attesa:
        description: "Secondi di attesa dopo ogni pagina"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  genera:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Installa dipendenze
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Genera il canale
        shell: powershell
        env:
          SITO: ${{ inputs.sito }}
          TIPO: ${{ inputs.tipo }}
          ATTESA: ${{ inputs.attesa }}
        run: |
          $u = $env:SITO.Trim()
          if ($u -notmatch '://') { $u = 'https://' + $u }
          $h = ([uri]$u).Host.ToLower() -replace '^www\d*\.', ''
          $parti = $h.Split('.')
          if ($parti.Length -gt 1) { $nome = $parti[$parti.Length - 2] } else { $nome = $parti[0] }
          $nome = $nome -replace '[^a-z0-9]', ''
          if (-not $nome) { $nome = 'canale' }
          "NOME=$nome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $extra = @()
          if ($env:TIPO -ne 'auto') { $extra = @('--tipo', $env:TIPO) }
          python s4me_gen.py $env:SITO --nome $nome --out "canali/$nome" --attesa $env:ATTESA @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Salva i file nella repo
        shell: powershell
        run: |
          git config user.name "aandroide"
          git config user.email "aandroide@users.noreply.github.com"
          git add "canali/$env:NOME"
          git commit -m "Canale generato: $env:NOME"
          git pull --rebase
          git push
