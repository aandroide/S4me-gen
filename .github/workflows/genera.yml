name: Genera canale S4Me

on:
  workflow_dispatch:
    inputs:
      sito:
        description: "Indirizzo del sito. Se il sito cambia per paese scrivi quello italiano, per esempio https://www.justwatch.com/it"
        required: true
      tipo:
        description: "Tipo di contenuti"
        required: false
        default: auto
        type: choice
        options: [auto, movie, tvshow, anime]
      proxy_italiano:
        description: "Cerca un proxy pubblico italiano (per siti che funzionano solo dall'Italia). Se hai il segreto PROXY_URL si usa quello."
        required: false
        default: false
        type: boolean
      liste_proxy:
        description: "Facoltativo: indirizzi di liste di proxy, separati da spazio (per esempio il link Scarica TXT di proxy5.net filtrato su Italia)"
        required: false
        default: ""
      attesa:
        description: "Secondi di attesa dopo ogni pagina"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROXY_SEGRETO: ${{ secrets.PROXY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Controlla se il sito ha Cloudflare
        id: cf
        env:
          SITO: ${{ inputs.sito }}
        run: |
          RIS=$(python3 s4me_gen.py "$SITO" --controlla-cf | tail -1)
          echo "Challenge Cloudflare: $RIS"
          echo "serve=$RIS" >> "$GITHUB_OUTPUT"

      - name: Avvia FlareSolverr
        if: steps.cf.outputs.serve == 'true'
        run: |
          docker run -d --name flaresolverr -p 8191:8191 -e LANG=en-US ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 30); do
            curl -s http://localhost:8191 > /dev/null && break
            sleep 2
          done

      - name: Cerca un proxy italiano
        if: inputs.proxy_italiano && env.PROXY_SEGRETO == ''
        env:
          SITO: ${{ inputs.sito }}
          PROXY_LISTE: ${{ inputs.liste_proxy }}
        run: |
          pip install "requests[socks]"
          python3 scegli_proxy.py "$SITO"

      - name: Genera il canale
        env:
          CLOUDFLARE: ${{ steps.cf.outputs.serve }}
          SITO: ${{ inputs.sito }}
          TIPO: ${{ inputs.tipo }}
          ATTESA: ${{ inputs.attesa }}
        run: |
          # nome della cartella: dominio senza http, www e estensione
          NOME=$(python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          u = os.environ['SITO'].strip()
          h = urlparse(u if '://' in u else 'https://' + u).netloc.lower()
          h = re.sub(r'^www\d*\.', '', h)
          parti = h.split('.')
          nome = parti[-2] if len(parti) > 1 else parti[0]
          print(re.sub(r'[^a-z0-9]', '', nome) or 'canale')
          PY
          )
          echo "NOME=$NOME" >> "$GITHUB_ENV"
          ARGS=""
          if [ "$TIPO" != "auto" ]; then ARGS="--tipo $TIPO"; fi
          if [ -z "$PROXY_URL" ] && [ -n "$PROXY_SEGRETO" ]; then export PROXY_URL="$PROXY_SEGRETO"; fi
          if [ -n "$PROXY_URL" ]; then echo "Uso un proxy per il browser"; fi
          if [ "$CLOUDFLARE" = "true" ]; then export FLARESOLVERR_URL=http://localhost:8191; fi
          python3 s4me_gen.py "$SITO" --nome "$NOME" --out "canali/$NOME" --attesa "$ATTESA" $ARGS

      - name: Prova il canale generato fino al video
        continue-on-error: true
        env:
          SITO: ${{ inputs.sito }}
        run: |
          pip install requests beautifulsoup4 lxml cryptography "urllib3<2"
          git clone -q --depth 1 https://github.com/stream4me/addon /tmp/kh/addon
          cp test/kodi_finto/fake.py /tmp/kh/fake.py
          mkdir -p /tmp/kh/prof
          cp "canali/$NOME/$NOME.py" "canali/$NOME/$NOME.json" /tmp/kh/addon/channels/
          PYTHONPATH=/tmp/kh:/tmp/kh/addon timeout 600 python3 -W ignore prova_video.py "$NOME" --host "$SITO" --out "canali/$NOME/prova" || true

      - name: Salva i file nella repo
        run: |
          git config user.name "aandroide"
          git config user.email "aandroide@users.noreply.github.com"
          git add "canali/$NOME"
          git commit -m "Canale generato: $NOME" || echo "Nessuna modifica"
          git pull --rebase
          git push

      - name: Allega anche come artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: canali/${{ env.NOME }}
