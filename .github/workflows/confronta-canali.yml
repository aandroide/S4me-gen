name: Confronta due canali

on:
  workflow_dispatch:
    inputs:
      riferimento:
        description: "File del canale di riferimento (per esempio scritto a mano)"
        required: true
        default: riparazioni/la7.py
      generato:
        description: "File del canale da confrontare (per esempio generato)"
        required: true
        default: archivio/canali/la7play/la7play.py
      sito:
        description: "Indirizzo del sito"
        required: true
        default: https://www.la7play.it

permissions:
  contents: write

jobs:
  confronta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: pip install requests beautifulsoup4 lxml cryptography "urllib3<2"
      - name: Scarica S4Me (sola lettura)
        run: |
          git clone -q --depth 1 https://github.com/stream4me/addon /tmp/kh/addon
          cp strumenti/test/kodi_finto/fake.py /tmp/kh/fake.py
          mkdir -p /tmp/kh/prof
      - name: Confronto
        env:
          RIF: ${{ inputs.riferimento }}
          GEN: ${{ inputs.generato }}
          SITO: ${{ inputs.sito }}
        run: |
          PYTHONPATH=/tmp/kh:/tmp/kh/addon timeout 1500 python3 -W ignore strumenti/confronta_canali.py "$RIF" "$GEN" --host "$SITO" --out rapporti/confronto
      - name: Salva
        if: always()
        run: |
          git config user.name aandroide
          git config user.email aandroide@users.noreply.github.com
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q origin/${{ github.ref_name }}
            git add rapporti/confronto
            git commit -q -m "Confronto dei canali" || break
            git push -q origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
