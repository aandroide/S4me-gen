name: Controlla canali

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      canali:
        description: 'Canali da controllare, separati da spazio (vuoto per tutti)'
        required: false
        default: ''
      riparare:
        description: 'Scrivere le correzioni quando una regex e rotta'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: pip install requests beautifulsoup4 lxml
      - name: Indirizzi e canali aggiornati dalla repo di S4Me
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 aggiorna_domini.py
          git config user.name aandroide
          git config user.email aandroide@users.noreply.github.com
          git add canali_base
          if ! git diff --cached --quiet; then
            git commit -m "Indirizzi e canali aggiornati dalla repo di S4Me"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi
      - name: Avvia FlareSolverr
        run: |
          docker run -d --name flaresolverr -p 8191:8191 -e LANG=en-US ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 30); do
            curl -s http://localhost:8191 > /dev/null && break
            sleep 2
          done
      - name: Controllo
        env:
          FLARESOLVERR_URL: http://localhost:8191
          CANALI: ${{ github.event.inputs.canali }}
          RIPARARE: ${{ github.event.inputs.riparare }}
        run: |
          OPZ=""
          if [ "$RIPARARE" = "false" ]; then OPZ="--senza-riparare"; fi
          rm -rf correzioni
          python3 controlla_canali.py $OPZ --tempo 600 $CANALI
      - name: Salva il rapporto
        run: |
          git config user.name aandroide
          git config user.email aandroide@users.noreply.github.com
          git add correzioni
          if ! git diff --cached --quiet; then
            git commit -m "Controllo dei canali"
            echo "CAMBIATO=1" >> "$GITHUB_ENV"
          fi
          # i file generati hanno sempre la precedenza su quelli di una run precedente
          for i in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
      - name: Avviso su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RIEP=$(grep '^Riepilogo' correzioni/RAPPORTO.md || true)
          PROBLEMI=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('correzioni/stato.json'))
          except Exception:
              d = []
          bad = [x for x in d if x['stato'] in ('ROTTO', 'CORRETTO', 'DOMINIO PARCHEGGIATO')]
          print(len(bad))
          PY
          )
          if [ "$PROBLEMI" != "0" ] && [ "$CAMBIATO" = "1" ]; then
            gh issue create --title "Controllo canali del $(date +%d/%m/%Y)" --body "$RIEP

          Il rapporto completo e in correzioni/RAPPORTO.md, i file corretti in correzioni/<canale>/." || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: controllo-canali
          path: correzioni
