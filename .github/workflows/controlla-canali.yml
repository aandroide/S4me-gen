name: Controlla canali

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      canali:
        description: 'Canali da controllare, separati da spazio (vuoto per tutti)'
        required: false
        default: ''
      riparare:
        description: 'Scrivere le correzioni quando una regex e rotta'
        type: boolean
        default: true
      video:
        description: 'Dopo il controllo delle regex, provare ogni canale fino al video'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: pip install requests beautifulsoup4 lxml
      - name: Indirizzi e canali aggiornati dalla repo di S4Me
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 strumenti/aggiorna_domini.py
          git config user.name aandroide
          git config user.email aandroide@users.noreply.github.com
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q origin/${{ github.ref_name }}
            git add canali_base
            if git diff --cached --quiet; then break; fi
            git commit -q -m "Indirizzi e canali aggiornati dalla repo di S4Me"
            git push -q origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
      - name: Avvia FlareSolverr
        run: |
          docker run -d --name flaresolverr -p 8191:8191 -e LANG=en-US ghcr.io/flaresolverr/flaresolverr:latest
          for i in $(seq 1 30); do
            curl -s http://localhost:8191 > /dev/null && break
            sleep 2
          done
      - name: Controllo
        env:
          FLARESOLVERR_URL: http://localhost:8191
          CANALI: ${{ github.event.inputs.canali }}
          RIPARARE: ${{ github.event.inputs.riparare }}
        run: |
          OPZ=""
          if [ "$RIPARARE" = "false" ]; then OPZ="--senza-riparare"; fi
          rm -rf rapporti/correzioni
          python3 strumenti/controlla_canali.py $OPZ --tempo 600 $CANALI
      - name: Salva il rapporto
        run: |
          git config user.name aandroide
          git config user.email aandroide@users.noreply.github.com
          # si riparte dall'ultima versione della repo e si aggiungono solo i file generati: nessun conflitto
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q origin/${{ github.ref_name }}
            git add rapporti/correzioni rapporti/snapshot_api
            if git diff --cached --quiet; then break; fi
            git commit -q -m "Controllo dei canali"
            echo "CAMBIATO=1" >> "$GITHUB_ENV"
            git push -q origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
      - name: Avviso su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RIEP=$(grep '^Riepilogo' rapporti/correzioni/RAPPORTO.md || true)
          PROBLEMI=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('rapporti/correzioni/stato.json'))
          except Exception:
              d = []
          bad = [x for x in d if x['stato'] in ('ROTTO', 'CORRETTO', 'CORRETTO IN PARTE', 'DOMINIO PARCHEGGIATO', 'BLOCCO ANTI BOT')]
          print(len(bad))
          PY
          )
          if [ "$PROBLEMI" != "0" ] && [ "$CAMBIATO" = "1" ]; then
            gh issue create --title "Controllo canali del $(date +%d/%m/%Y)" --body "$RIEP

          Il rapporto completo e in rapporti/correzioni/RAPPORTO.md, i file corretti in rapporti/correzioni/<canale>/." || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: controllo-canali
          path: rapporti/correzioni

  video:
    needs: controlla
    runs-on: ubuntu-latest
    timeout-minutes: 170
    if: ${{ github.event.inputs.video != 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: pip install requests beautifulsoup4 lxml cryptography "urllib3<2"
      - name: Scarica S4Me (sola lettura)
        run: |
          git clone -q --depth 1 https://github.com/stream4me/addon /tmp/kh/addon
          cp strumenti/test/kodi_finto/fake.py /tmp/kh/fake.py
          mkdir -p /tmp/kh/prof
      - name: Prova ogni canale fino al video
        run: |
          rm -rf rapporti/prove
          mkdir -p rapporti/prove
          CANALI="${{ github.event.inputs.canali }}"
          if [ -z "$CANALI" ]; then CANALI=$(ls canali_base/*.py | xargs -n1 basename | sed 's/\.py$//'); fi
          for c in $CANALI; do
            f=/tmp/kh/addon/channels/$c.py
            [ -f rapporti/correzioni/$c/$c.py ] && cp rapporti/correzioni/$c/$c.py $f
            if [ -f riparazioni/$c.py ]; then cp riparazioni/$c.py $f; [ -f riparazioni/$c.json ] && cp riparazioni/$c.json /tmp/kh/addon/channels/; fi
          done
          echo $CANALI | tr ' ' '\n' | xargs -P 6 -I{} sh -c 'PYTHONPATH=/tmp/kh:/tmp/kh/addon timeout 200 python3 -W ignore strumenti/prova_video.py {} --out rapporti/prove > /dev/null 2>&1 || echo "tempo scaduto o errore: {}"'
          python3 strumenti/riepilogo_video.py
      - name: Salva
        run: |
          git config user.name aandroide
          git config user.email aandroide@users.noreply.github.com
          for i in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q origin/${{ github.ref_name }}
            git add rapporti/prove
            git commit -q -m "Controllo dei canali fino al video" || break
            git push -q origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: controllo-video
          path: rapporti/prove/RAPPORTO_VIDEO.md
