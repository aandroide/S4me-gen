x360.webp&quot;}},&quot;next_episode_number&quot;:null,&quot;variants&quot;:[{&quot;language&quot;:&quot;jpn&quot;,&quot;status&quot;:&quot;completed&quot;,&quot;airing_day&quot;:&quot;undefined&quot;,&quot;episodes_count&quot;:12}],&quot;genres&quot;:[{&quot;id&quot;:2,&quot;name&quot;:&quot;Adventure&quot;},{&quot;id&quot;:5,&quot;name&quot;:&quot;Comedy&quot;},{&quot;id&quot;:9,&quot;name&quot;:&quot;Fantasy&quot;},{&quot;id&quot;:10,&quot;name&quot;:&quot;Game&quot;},{&quot;id&quot;:35,&quot;name&quot;:&quot;Sci-fi&quot;},{&quot;id&quot;:38,&quot;name&quot;:&quot;Shounen&quot;}],&quot;studios&quot;:[{&quot;id&quot;:93,&quot;name&quot;:&quot;Bee Train&quot;}],&quot;list_info&quot;:null,&quot;plot&quot;:&quot;Shugo ha 14 anni e, stufo dei videogiochi decide di provare a partecipare al gioco MMORPG \&quot;The World\&quot;, persuaso dalla sorella Rena che ha vinto due avatar molto famosi (i .hackers Kite e Black Rose). Milioni di persone sono iscritte a The World, che \u00e8 il pi\u00f9 grande MMORPG del mondo di genere fantasy. I giocatori sono immersi in una vera e propria realt\u00e0 virtuale indossando dei caschi visivi da indossare. Dopo uno strano combattimento in cui Shugo esaurisce gli HP, appare Aura che d\u00e0 a Shugo il Bracciale del Crepuscolo. Shugo quindi intraprende un&#039;avventura per trovare Aura e dipanare il mistero del Bracciale, un elemento che pu\u00f2 ostacolare o aiutare coloro che vengono a contatto con esso. Lungo il percorso, Shugo e Rena incontrano molti amici tra cui Mireille cacciatrice di rarit\u00e0, la licantropa Ouka, e la pacifica Hotaru.\r\n\r\nUna notte, mentre il gruppo \u00e8 in attesa dell&#039;inizio di un evento, Shugo incontra una strana ragazza di nome Zefie. Zefie \u00e8 attratta da Shugo perch\u00e9 sente nel bracciale lo stesso odore di sua madre, Aura. Si rendono poi conto che Zefie \u00e8 una vagrant AI, un personaggio non giocante che agisce indipendentemente dai parametri di gioco (una sorta di bug). Zefie attrae l&#039;attenzione della Brigata del Cavaliere Cobalto atta all&#039;eliminazione dei bug. Nel frattempo Balmung, uno degli admin del gioco, viene ripreso per non aver intrapreso azioni punitive nei confronti di Shugo e del Bracciale del Crepuscolo considerato illegale, viene quindi dimesso dal ruolo di admin tornando ad essere semplice giocatore; Kamui, capo della Brigata del Cavaliere Cobalto, \u00e8 quindi mandata alla ricerca di Shugo e della sua compagnia per coglierli in flagrante e arrestarli. Catturati con successo Shugo chiede di essere cancellato senza processo a condizione di liberare i suoi amici, in quanto non implicati con la vicenda del Bracciale. Kamui libera Mireille, Ouka e Hotaru, ma trattiene Rena e Zefie, sar\u00e0 proprio quest&#039;ultima a liberarli aprendo un passaggio dimensionale. Ora sono liberi, ma clandestinamente, devono stare attenti perch\u00e9 a breve avranno nuovamente il fiato sul collo di Kamui e della Brigata del Cavaliere Cobalto; decidono quindi, per sopravvivere e continuare a combattere, di raggiungere i \&quot;Sobborghi di rete\&quot; (una zona piena di bug non accessibile direttamente al gioco) in cui vagano hacker e vagrant AI. Con l&#039;aiuto della vera mamma di Mireille il suo personaggio contatta Kaz, un amico di vecchia data di Mistral (il nick della mamma di Mireille quando 4 anni prima giocava con quell&#039;avatar) e ex vicino di casa di Shugo e Rena, che gli consegna la Helba Key, utile per accedere ai sobborghi di rete, ma proprio sul pi\u00f9 bello compare la Brigata e Kamui che intima di consegnarle l&#039;Helba Key. Shugo riesce a spezzare l&#039;ascia di Kamui battendola; a questo punto Shugo, Rena, Mireille, Hotaru e Zefie possono accedere indisturbati ai sobborghi. Arrivati gli si para davanti Balmung, che ostinato dice a Shugo di non poter proseguire se prima non fosse riuscito a ferirlo. Superata la prova Balmung consegna a Shugo il Virus Core per accedere all&#039;area \&quot;Twilight\&quot; isolata dal tempo e dallo spazio, in cui risiede Aura.&quot;,&quot;is_adult&quot;:false,&quot;mal_id&quot;:298,&quot;anilist_id&quot;:298},{&quot;id&quot;:831,&quot;slug&quot;:&quot;hackquantum&quot;,&quot;title&quot;:&quot;.hack\/\/Quantum&quot;,&quot;title_ja&quot;:null,&quot;title_it&quot;:null,&quot;type&quot;:&quot;ova&quot;,&quot;season&quot;:&quot;winter&quot;,&quot;year&quot;:2011,&quot;total_episodes&quot;:3,&quot;episode_runtime&quot;:26,&quot;default_status&quot;:&quot;completed&quot;,&quot;score&quot;:&quot;6.50&quot;,&quot;views&quot;:25606,&quot;members&quot;:142,&quot;favorites&quot;:13,&quot;poster_color&quot;:&quot;#3543a1&quot;,&quot;images&quot;:{&quot;banner&quot;:null,&quot;cover&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/28371l.jpg&quot;,&quot;poster&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/9332.jpg&quot;,&quot;logo&quot;:null},&quot;image_variants&quot;:{&quot;poster&quot;:{&quot;160&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/variants\/v1\/392d166166791b6dfda8_160.webp&quot;,&quot;240&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/variants\/v1\/392d166166791b6dfda8_240.webp&quot;,&quot;384&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/variants\/v1\/392d166166791b6dfda8_384.webp&quot;,&quot;460&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/variants\/v1\/392d166166791b6dfda8_460.webp&quot;},&quot;cover&quot;:{&quot;320&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/variants\/v1\/047f78692c68849c28e1_320x180.webp&quot;,&quot;640&quot;:&quot;https:\/\/img.animeunity.cx\/anime\/variants\/v1\/047f78692c68849c28e1_640x360.webp&quot;}},&quot;next_episode_number&quot;:null,&quot;variants&quot;:[{&quot;language&quot;:&quot;jpn&quot;,&quot;status&quot;:&quot;completed&quot;,&quot;airing_day&quot;:&quot;undefined&quot;,&quot;episodes_count&quot;:3}],&quot;genres&quot;:[{&quot;id&quot;:1,&quot;name&quot;:&quot;Action&quot;},{&quot;id&quot;:2,&quot;name&quot;:&quot;Adventure&quot;},{&quot;id&quot;:9,&quot;name&quot;:&quot;Fantasy&quot;},{&quot;i
