ilist_id&quot;:21,&quot;season&quot;:&quot;Autunno&quot;,&quot;title_it&quot;:null,&quot;mal_id&quot;:21,&quot;crunchy_id&quot;:null,&quot;netflix_id&quot;:null,&quot;prime_id&quot;:&quot;0QN6GA8OASZY2UYU67FDBYSVNX&quot;,&quot;disney_id&quot;:null},{&quot;id&quot;:743,&quot;user_id&quot;:2,&quot;title&quot;:&quot;Meitantei Conan&quot;,&quot;imageurl&quot;:&quot;https:\/\/cdn.myanimelist.net\/images\/anime\/1593\/138525.jpg&quot;,&quot;plot&quot;:&quot;Shinichi Kudo \u00e8 un liceale di sedici anni (diciassette nel corso della serie) e, nonostante la giovane et\u00e0, \u00e8 un abilissimo investigatore che spesso collabora con la polizia risolvendo casi molto complicati. Grande fan di Sherlock Holmes sogna di emularne le gesta e di diventare \u00abl\u2019Holmes del nuovo millennio\u00bb. Un giorno, recatosi con l\u2019amica d\u2019infanzia Ran Mori a Tropical Land, un parco divertimenti, assiste in prima persona ad un sanguinoso caso di omicidio sulle montagne russe riuscendo, poco dopo, a risolverlo ed a smascherare il colpevole. Prima di tornare a casa, assiste ad uno scambio di una ingente somma di denaro tra due uomini; uno di loro \u00e8 membro di una misteriosa organizzazione criminale ed \u00e8 vestito completamente di nero. Preso da ci\u00f2 che stava accadendo davanti ai suoi occhi, Shinichi non si accorge dell\u2019arrivo alle sue spalle di un altro affiliato e finisce col venire scoperto e catturato; essendo un testimone scomodo, i due uomini decidono di ucciderlo somministrandogli una sostanza chiamata APTX4869. Il farmaco, tuttavia, ha un effetto ben diverso sul giovane: lo ringiovanisce di dieci anni.&quot;,&quot;date&quot;:&quot;1996&quot;,&quot;episodes_count&quot;:0,&quot;episodes_length&quot;:25,&quot;author&quot;:&quot; &quot;,&quot;created_at&quot;:&quot;2019-06-06 20:29:47&quot;,&quot;status&quot;:&quot;In Corso&quot;,&quot;imageurl_cover&quot;:&quot;https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/banner\/235-MTmiz0uB0fMd.jpg&quot;,&quot
