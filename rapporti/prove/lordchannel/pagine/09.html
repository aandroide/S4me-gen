<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manutenzione – LC3Remix</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .spinner {
        width: 56px; height: 56px;
        margin: 0 auto 28px;
        border: 4px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 2rem; font-weight: 800; color: #f8fafc; margin-bottom: 12px; }
      p { font-size: 1.05rem; color: #94a3b8; max-width: 480px; margin: 0 auto; }
      .badge {
        display: inline-block;
        margin-top: 28px;
        padding: 6px 14px;
        border: 1px solid #334155;
        border-radius: 999px;
        font-size: 0.85rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <h1>Siamo in manutenzione</h1>
      <p>Stiamo lavorando per migliorare LC3Remix. Torna tra poco, ti aspettiamo!</p>
      <div class="badge">Torna presto</div>
    </div>
  </body>
</html>
