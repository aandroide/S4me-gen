    /* Rimuove l'ombra per mobile (opzionale, basato su tendenza mobile vs desktop) */\n    box-shadow: none;\n    \n    box-sizing: border-box;\n}\n\n/* Media query per desktop */\n@media (min-width: 768px) { /* Puoi aggiustare questo breakpoint se necessario */\n\n\n    .site-message-overlay {\n        padding: 20px; /* Ripristina un leggero padding sull'overlay per desktop se desiderato, altrimenti lascialo a 0 */\n    }\n\n    .site-message-content {\n        /* Larghezza fissa per desktop */\n        width: 562px;\n        max-width: 562px; /* Assicura che non superi questa larghezza */\n         /* Applica l'ombra solo per desktop */\n        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.16); /* Ombra matching #000000 opacità 16% */\n    }\n    .site-message-content p {\n        font-size:16px;\n    }\n    .site-message-content h2 {\n        font-size:20px;\n    }\n}\n\n\n/* The countdown timer in the top-right corner */\n.site-message-counter {\n    position: absolute;\n    top: 15px; /* Position from the top edge */\n    right: 15px; /* Position from the right edge */\n    font-size: 1em; /* Smaller size matching visual */\n    font-weight: normal; /* Not bold matching visual */\n    color: #0B1C21; /* Dark grey color matching the image */\n}\n\n.close-button {\n    cursor: pointer;\n    font-size: 1.5em;\n}\n\n/* Style for the main title (h2) */\n.site-message-content h2 {\n    margin-top: 0;\n    margin-bottom: 20px; /* Space below the title */\n    color: #1D5F72; /* Teal/blue-grey color matching the image */\n    font-weight: bold; /* Ensure title is bold */\n    font-family: 'Gotham-Bold', sans-serif; /* Use a bold font similar to the image */\n    font-size: 24px; /* Standard size for h2 */\n    line-height: 1.333; /* Improve readability for multi-line titles */\n}\n\n/* Style for all paragraphs within the modal content */\n.site-message-content p {\n    color: #0B1C21 !important; /* Dark grey color matching the image */\n    margin-top: 0; /* Remove default top margin */\n    margin-bottom: 15px; /* Consistent space below each paragraph (will be doubled by <br><br>) */\n    line-height: 24px; /* Improve readability */\n    font-family: 'Gotham-medium', sans-serif; /* Use a medium font similar to the image */\n    font-size: 1.333; /* Standard size for body text */\n}\n\n/* Specific adjustment for the last paragraph before the button for slightly more space */\n/* This rule targets the last <p> element directly before the button */\n.site-message-content p:last-of-type {\n     margin-bottom: 25px; /* Slightly more space */\n}\n\n\n/* Style for the 'AdBlock' span mentioned in the message */\n.site-message-content .abl_la7 {\n    color: #1D5F72; /* Color matching the title color */\n    font-weight: bold; /* Optional: make AdBlock text bold for emphasis */\n}\n\n\n/* Style for the main action button */\n.site-message-button {\n    background-color: #F9AC1D; /* Orange color matching the image */\n    color: #0b1c21; /* Testo scuro come da ultimo CSS fornito */\n    padding: 12px 25px;\n    border: none;\n    border-radius: 8px; /* Usa il raggio specificato nel tuo ultimo CSS */\n    cursor: pointer;\n    font-size: 1em;\n    font-weight: bold;\n    transition: background-color 0.3s ease;\n    text-transform: uppercase; /* Match the uppercase text in the image */\n    width: auto; /* Button width based on content */\n    display: inline-block; /* Ensures button is centered if parent has text-align: center */\n    text-decoration: none; /* Remove potential underline if it's an <a> tag */\n    /* Usa l'ombra specifica del bottone dal tuo ultimo CSS */\n    box-shadow: -1px -2px 9px 6px rgba(0, 0, 0, 0.16);\n}\n\n/* Rimuove l'ombra al passaggio del mouse se presente nel tuo ultimo CSS, altrimenti regola il background-color */\n.site-message-button:hover {\n    /* Mantieni o regola questo se vuoi un effetto hover */\n     background-color: #e07b00; /* Esempio: arancione leggermente più scuro */\n}\n\n\n.site-message-button:disabled {\n    background-color: #cccccc; /* Grey out disabled button */\n    cursor: not-allowed;\n}\n\n\n/* --- Styles below are for the adblocker selection/instructions part --- \n   These are included based on the provided TS code structure, but are NOT\n   visible in the image provided. Keeping them as they are part of the component. */\n\n.item-list {\n    display: flex;\n    justify-content: center; /* Center the logos horizontally */\n    flex-wrap: wrap; /* Allow items to wrap to the next line if needed */\n    gap: 20px; /* Add space between logos */\n    margin-top: 20px;\n    transition: all 0.3s ease; /* Smooth transition for layout changes */\n}\n\n.item-list.item-selected-view {\n    /* Adjust layout when an item is selected, if needed */\n    align-items: center;\n    justify-content: center;\n}\n\n.item-selection {\n    cursor: pointer;\n    display: flex;\n    flex-direction: column; /* Stack logo and potential future elements vertically */\n    align-items: center; /* Center content within each item */\n    transition: opacity 0.3s ease, transform 0.3s ease; /* Smooth transitions */\n    padding: 10px; /* Add some padding around the logo */\n    border-radius: 8px; /* Rounded corners */\n}\n\n.item-selection.opacified {\n    opacity: 0.3; /* Reduce opacity for non-selected items */\n}\n\n.item-selection.selected {\n    border: 2px solid #ff8c00; /* Example: Add an orange border */\n    transform: scale(1.1); /* Example: Slightly enlarge the selected logo */\n    opacity: 1; /* Ensure selected item is fully opaque */\n}\n\n.item-logo {\n    width: 50px; /* Adjust size as needed */\n    height: 50px; /* Adjust size as needed */\n    object-fit: contain; /* Ensure the entire logo is visible */\n}\n\n.item-selection span {\n    display: none; /* Hide the span containing the name */\n}\n\n\n#instructions-container {\n    margin-top: 20px; /* Space above instructions */\n    text-align: left; /* Align text to the left */\n    width: 100%; /* Take full width */\n}\n\n#instructions-container ol {\n    padding-left: 20px; /* Indent list */\n}\n\n#instructions-container li {\n    margin-bottom: 10px; /* Space between list items */\n    line-height: 1.5; /* Improve readability */\n}\n\n#instructions-container .back-button {\n    margin-top: 15px; /* Space above the back button */\n    background-color: #ccc; /* Example: Grey background for back button */\n    color: #333; /* Example: Dark text color */\n    padding: 8px 15px;\n    border: none;\n    border-radius: 5px;\n    cursor: pointer;\n    transition: background-color 0.3s ease;\n}\n\n#instructions-container .back-button:hover {\n    background-color: #bbb; /* Slightly darker grey on hover */\n}\n\n.inline-logo {\n    display: inline-block; /* Make it an inline block element */\n    vertical-align: middle; /* Align vertically with text */\n    height: 1.2em; /* Set height relative to surrounding
